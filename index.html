<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenMethod</title>
<style>
:root{--bg:#0b0b0d;--card:#121214;--card2:#1b1b1e;--line:#3a3220;--gold:#f6c744;--gold2:#fde68a;--gold3:#c9961a;--tx:#fff;--mut:#8d8d94}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 400px at 50% -100px,#2a2210,transparent),var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;padding:14px 14px 60px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2a2e;border-radius:30px;padding:14px 20px;background:#0f0f11;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:1px}
.logo i{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#111;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:900}
.logo b{color:var(--gold)}
.steps{display:flex;align-items:center;gap:8px;margin-bottom:22px;font-size:14px;color:var(--mut)}
.steps .s{display:flex;align-items:center;gap:8px;white-space:nowrap}
.steps .n{width:34px;height:34px;border-radius:50%;border:2px solid #333;display:grid;place-items:center;font-weight:700;flex:none}
.steps .s.on{color:#fff}.steps .s.on .n{background:var(--gold);border-color:var(--gold);color:#111}
.steps .s.done .n{border-color:var(--gold);color:var(--gold)}
.steps .l{flex:1;height:1px;background:#2c2c30;min-width:8px}
.panel{background:var(--card);border:1px solid #26262a;border-radius:28px;padding:22px}
.hd{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.hd .num{width:48px;height:48px;border-radius:14px;background:var(--gold);color:#111;font-weight:800;font-size:20px;display:grid;place-items:center;flex:none}
h1{font-size:26px;letter-spacing:-.5px}h2{font-size:22px;letter-spacing:-.4px}
.sub{color:var(--mut);margin-top:6px;line-height:1.5}
.drop{border:2px dashed #444;border-radius:22px;padding:42px 16px;text-align:center;cursor:pointer;background:#0c0c0e;transition:.2s}
.drop.over{border-color:var(--gold);background:#1a1608}
.plus{width:62px;height:62px;border-radius:18px;background:var(--gold);color:#111;font-size:32px;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 0 30px #f6c74433}
.drop b{font-size:21px;display:block}.drop span{color:var(--mut);font-size:14px}
.or{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--mut);font-weight:700;font-size:13px;letter-spacing:2px}
.or:before,.or:after{content:"";flex:1;height:1px;background:#2c2c30}
.link{border:1px solid var(--line);border-radius:22px;padding:22px;background:linear-gradient(#1c170b,#14120c)}
.tag{color:var(--gold);font-size:12px;letter-spacing:2px;font-family:Consolas,monospace}
.link h2{margin:10px 0 8px}
input[type=url]{width:100%;margin-top:14px;background:#0c0c0e;border:1px solid #333;border-radius:16px;padding:16px;color:#fff;font-size:15px;outline:none}
input[type=url]:focus{border-color:var(--gold)}
.btn{width:100%;border:0;border-radius:18px;padding:20px 22px;font-size:18px;font-weight:800;color:#141414;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,var(--gold2),var(--gold) 55%,var(--gold3));margin-top:14px;border:1px solid #f6c74488}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:#ddd;border:1px solid #2c2c30;justify-content:center;font-size:16px;font-weight:600}
.fileinfo{margin-top:16px;border:1px solid var(--gold);border-radius:16px;padding:14px 16px;background:#1a1608;display:none;font-size:14px;word-break:break-all}
.opt{position:relative;border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:22px;background:#111113;cursor:pointer}
.opt.sel{border:1.5px solid var(--gold);background:#1a1710}
.opt .rec{position:absolute;top:-14px;left:22px;background:var(--gold);color:#111;font-weight:800;font-size:12px;letter-spacing:1px;padding:6px 14px;border-radius:14px}
.opt .row{display:flex;gap:16px;align-items:flex-start}
.radio{width:40px;height:40px;border-radius:50%;border:2px solid #444;flex:none;display:grid;place-items:center}
.opt.sel .radio{border-color:var(--gold)}.opt.sel .radio:after{content:"";width:18px;height:18px;border-radius:50%;background:var(--gold)}
.opt h3{font-size:20px}.opt p{color:var(--mut);line-height:1.5;margin-top:8px}
.badge{display:inline-block;background:var(--gold);color:#111;font-size:11px;font-weight:800;padding:5px 11px;border-radius:12px;margin-top:8px;letter-spacing:1px}
.badge.o{background:#2a2412;color:var(--gold);border:1px solid #6b5a22}
.opt .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.tut{background:#25200f;border:1px solid #6b5a22;color:var(--gold);font-weight:700;border-radius:14px;padding:14px 18px;font-size:15px;cursor:pointer}
.left{background:var(--gold);color:#111;font-weight:800;font-size:12px;padding:10px 14px;border-radius:10px;letter-spacing:1px}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;width:100%;max-width:460px}
.box .tag{display:block;margin-bottom:12px}
.choice{border:1px solid #2c2c30;background:var(--card2);border-radius:20px;padding:20px 22px;margin-top:16px;cursor:pointer}
.choice.sel{border-color:var(--gold);background:#231d0f}
.choice h3{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.choice p{color:var(--mut);margin-top:8px;line-height:1.5}
.choice.on{border-color:var(--gold);background:#231d0f}
.bar{height:14px;border-radius:8px;background:#26262a;overflow:hidden;margin:26px 0 10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width .2s}
.center{text-align:center}
.center h1{font-size:36px;margin:12px 0}
.file{display:flex;justify-content:space-between;gap:12px;border:1px solid #2c2c30;background:#0d0d0f;border-radius:18px;padding:18px;margin-top:22px;font-size:14px}
.file small{color:var(--mut);display:block;margin-top:4px}.file em{color:var(--gold);font-style:normal;font-weight:700}
.remind{border:1px solid var(--line);background:#17140c;border-radius:18px;padding:20px;margin-top:20px;text-align:left}
.remind h3{margin:10px 0}.remind ul{padding-left:20px;color:#bbb;line-height:1.8}.remind b{color:var(--gold2)}
.codec{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;color:var(--mut);font-size:14px}.codec div{display:flex;gap:8px}.codec button{background:#1b1b1e;border:1px solid #2c2c30;color:#ccc;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.codec button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.codec button.on{background:var(--gold);color:#111}
.err{color:#ff8a8a;margin-top:14px;font-size:14px;display:none}
video,canvas{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>ZM</i><span>ZEN<b>METHOD</b> <small style="color:#8d8d94;font-weight:500;letter-spacing:0">v4</small></span></div>
    <span style="font-size:26px">&#9776;</span>
  </header>
  <div class="steps" id="steps"></div>
  <main id="app"></main>
</div>
<div class="modal" id="modal"></div>
<video id="vid" playsinline preload="auto"></video>
<canvas id="cv"></canvas>

<script>
const METHODS = {
  max:{name:"MAX QUALITY + FPS METHOD",tag:"QUALITY + FPS",desc:"Ekspor MP4 lokal berkualitas tinggi hingga 1080p, mempertahankan timing frame sumber.",h:1080,fps:60,br:14e6,rec:true},
  fps:{name:"FPS Method",tag:"FPS",desc:"Untuk ponsel saat kamu hanya butuh patch FPS. Tidak termasuk metode kualitas.",h:0,fps:60,br:9e6},
  p720:{name:"720p60 Method",tag:"720p60",desc:"Render ulang ke 720p 60 FPS dengan bitrate stabil.",h:720,fps:60,br:7e6}
};
const S = {step:1, file:null, url:"", method:"max", engine:"Editing News", extra:null, codec:"avc", upscale:false, quota:6, progress:0, out:null, err:""};
const $ = s => document.querySelector(s);

function renderSteps(){
  const n = ["Video","Method","Download"];
  $("#steps").innerHTML = n.map((t,i)=>{
    const c = S.step===i+1?"on":(S.step>i+1?"done":"");
    return `<div class="s ${c}"><div class="n">${i+1}</div><span>${t}</span></div>`+(i<2?'<div class="l"></div>':'');
  }).join("");
}

function view(){
  renderSteps();
  const a = $("#app");
  if(S.step===1){
    a.innerHTML = `<section class="panel">
      <div class="hd"><div class="num">1</div><div><h1>Pilih videomu</h1><p class="sub">Semua format video umum didukung.</p></div></div>
      <div class="drop" id="drop"><div class="plus">+</div><b>Pilih video</b><span>atau seret &amp; lepas file di sini</span></div>
      <input type="file" id="file" accept="video/*" hidden>
      <div class="fileinfo" id="fi"></div>
      <div class="or">ATAU</div>
      <div class="link"><div class="tag">TAUTAN LANGSUNG</div><h2>Gunakan link video</h2>
        <p class="sub">Tempel link langsung ke file video (.mp4 / .webm). Server harus mengizinkan CORS.</p>
        <input type="url" id="url" placeholder="https://contoh.com/video.mp4" value="${S.url}"></div>
      <div class="err" id="err"></div>
      <button class="btn" id="next1">Lanjut <span>&rarr;</span></button>
    </section>`;
    const drop=$("#drop"), f=$("#file");
    drop.onclick=()=>f.click();
    f.onchange=()=>setFile(f.files[0]);
    ["dragover","dragenter"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",ev=>setFile(ev.dataTransfer.files[0]));
    $("#url").oninput=e=>S.url=e.target.value.trim();
    $("#next1").onclick=async()=>{
      if(!S.file && S.url){
        try{ $("#next1").disabled=true; const r=await fetch(S.url); if(!r.ok) throw 0; const b=await r.blob(); S.file=new File([b],S.url.split("/").pop().split("?")[0]||"video.mp4",{type:b.type||"video/mp4"}); }
        catch(e){ showErr("Link tidak bisa diambil. Unduh videonya lalu pilih sebagai file."); $("#next1").disabled=false; return; }
      }
      if(!S.file) return showErr("Pilih video atau tempel link dulu.");
      S.step=2; view();
    };
    if(S.file) showFile();
  }
  if(S.step===2){
    a.innerHTML = `<section class="panel">
      <div class="hd"><div class="num">2</div><div><h1>Pilih metode</h1><p class="sub">Video: ${esc(S.file.name)}</p></div></div>
      ${Object.entries(METHODS).map(([k,m])=>`
      <div class="opt ${S.method===k?"sel":""}" data-k="${k}">
        ${m.rec?'<div class="rec">DIREKOMENDASIKAN &mdash; MULAI DI SINI</div>':''}
        <div class="row"><div class="radio"></div><div><h3>${m.name}</h3>${m.rec?'<span class="badge">VERSI BARU</span>':''}<p>${m.desc}</p></div></div>
        <div class="foot"><button class="tut" data-t="${k}">Lihat tutorial &#9654;</button>${m.rec?`<span class="left">${S.quota} DARI 6 TERSISA</span>`:''}</div>
      </div>`).join("")}
      <div class="codec"><span>Codec video</span><div><button data-c="avc" class="${S.codec==="avc"?"on":""}">H.264</button><button data-c="hevc" class="${S.codec==="hevc"?"on":""}">HEVC (H.265)</button></div></div>
      <div class="codec"><span>Perbesar ke 1080p</span><div><button data-u="0" class="${!S.upscale?"on":""}">Mati</button><button data-u="1" class="${S.upscale?"on":""}">Hidup</button></div></div>
      <button class="btn" id="start">Mulai proses <span>&rarr;</span></button>
      <button class="btn ghost" id="back">Kembali</button>
    </section>`;
    document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{S.method=o.dataset.k;view()});
    document.querySelectorAll(".tut").forEach(b=>b.onclick=e=>{e.stopPropagation();alert("Tutorial untuk "+METHODS[b.dataset.t].name+":\n1. Pilih video\n2. Pilih metode\n3. Tunggu render selesai\n4. Unduh hasilnya")});
    $("#back").onclick=()=>{S.step=1;view()};
    document.querySelectorAll(".codec button[data-c]").forEach(b=>b.onclick=()=>{S.codec=b.dataset.c;view()});
    document.querySelectorAll(".codec button[data-u]").forEach(b=>b.onclick=()=>{S.upscale=b.dataset.u==="1";view()});
    $("#start").onclick=()=>{ if(S.method==="max") openEngine(); else {S.extra=null; process();} };
  }
  if(S.step===3){
    a.innerHTML = `<section class="panel center">
      <div class="tag">MEMPROSES</div><h1>Merender videomu</h1>
      <p class="sub">${METHODS[S.method].name}${S.extra?" + "+S.extra:""}. Biarkan tab ini tetap terbuka.</p>
      <div class="bar"><i id="pb"></i></div><p class="sub" id="pt">0%</p>
      <div class="err" id="err"></div>
    </section>`;
  }
  if(S.step===4){
    a.innerHTML = `<section class="panel center">
      <div class="tag">RENDER SELESAI</div><h1>Videomu sudah siap</h1>
      <p class="sub">${METHODS[S.method].name} berhasil diselesaikan.</p><p class="sub" style="font-size:13px">Engine: ${esc(S.engine2||"-")}</p>
      <div class="file"><div style="text-align:left;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px;font-weight:700">${esc(S.out.name)}</div><small>${(S.out.blob.size/1048576).toFixed(1)} MB &middot; ${S.out.ext.toUpperCase()}</small></div><em>Siap</em></div>
      <div class="remind"><div class="tag">PENGINGAT CEPAT</div><h3>Sebelum mengunggah ke TikTok</h3>
        <ul><li>Gunakan TikTok Web (mode Desktop aktif)</li><li>Jangan edit, crop, atau tambah musik</li><li>Gunakan <b>#ZenMethod</b> untuk mendukung kami</li></ul></div>
      <button class="btn" id="dl">Unduh video <span>&darr;</span></button>
      <button class="btn ghost" id="again">&#8635;&nbsp; Proses video lain</button>
    </section>`;
    $("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(S.out.blob);a.download=S.out.name;a.click()};
    $("#again").onclick=()=>{Object.assign(S,{step:1,file:null,url:"",extra:null,out:null,progress:0});view()};
  }
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function showErr(m){const e=$("#err");e.textContent=m;e.style.display="block"}
function setFile(f){ if(!f) return; if(!f.type.startsWith("video/")) return showErr("File harus berupa video."); S.file=f; S.url=""; showFile(); }
function showFile(){const fi=$("#fi");fi.style.display="block";fi.textContent=S.file.name+" \u2014 "+(S.file.size/1048576).toFixed(1)+" MB"}

function modal(html){const m=$("#modal");m.innerHTML=`<div class="box">${html}</div>`;m.classList.add("show");return m}
function closeModal(){$("#modal").classList.remove("show")}

function openEngine(){
  const m = modal(`<span class="tag">QUALITY + FPS</span><h2>Pilih engine</h2><p class="sub">Pilih engine yang ingin dipakai untuk video ini.</p>
    <div class="choice sel" data-e="Editing News"><h3>Editing News <span class="badge o">LEBIH BAIK</span></h3><p>Dipilih secara default</p></div>
    <div class="choice" data-e="Nova"><h3>Nova <span class="badge o">BETA</span></h3><p>Render alternatif</p></div>
    <button class="btn" id="useE">Pakai <span id="en">Editing News</span> <span>&rarr;</span></button>`);
  let eng="Editing News";
  m.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{eng=c.dataset.e;m.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");$("#en").textContent=eng});
  $("#useE").onclick=()=>{S.engine=eng;openPrepare()};
}
function openPrepare(){
  const m = modal(`<span class="tag">${S.engine.toUpperCase()}</span><h2>Siapkan videomu?</h2><p class="sub">Pilih langkah opsional sebelum diproses.</p>
    <div class="choice" data-x="Anti Lag"><h3>Anti Lag <span class="badge o">BETA</span></h3><p>Kompresi lossy dengan batas video 7 Mbps.</p></div>
    <div class="choice" data-x="TikTok"><h3>Optimalkan untuk TikTok</h3><p>Perkecil ukuran file sebelum diproses.</p></div>
    <button class="btn" id="go">Lanjut tanpa tambahan <span>&rarr;</span></button>
    <button class="btn ghost" id="bk">Kembali</button>`);
  let x=null;
  m.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{ x = x===c.dataset.x?null:c.dataset.x; m.querySelectorAll(".choice").forEach(e=>e.classList.toggle("on",e.dataset.x===x)); $("#go").firstChild.textContent = x?"Lanjut dengan "+x+" ":"Lanjut tanpa tambahan "; });
  $("#bk").onclick=openEngine;
  $("#go").onclick=()=>{S.extra=x;closeModal();process()};
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function loadScript(u){return new Promise(r=>{const e=document.createElement("script");e.src=u;e.onload=()=>r(true);e.onerror=()=>r(false);document.head.appendChild(e)})}
const CODECS={avc:["avc1.640033","avc1.64002A","avc1.4d002A","avc1.42001f"],hevc:["hvc1.1.6.L153.B0","hvc1.1.6.L123.B0","hvc1.1.6.L93.B0"]};
async function pickCodec(kind,w,h,br,fps){
  for(const c of CODECS[kind]){try{const r=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate:br,framerate:fps});if(r.supported)return c}catch(e){}}
  return null;
}
function seekTo(v,t){return new Promise(res=>{const d=()=>{v.removeEventListener("seeked",d);clearTimeout(tm);res()};const tm=setTimeout(d,1500);v.addEventListener("seeked",d);v.currentTime=t})}
async function probeFps(v){
  const ts=[];
  await new Promise(res=>{
    const end=()=>{v.pause();res()};
    const cb=(n,m)=>{ts.push(m.mediaTime); if(ts.length>=24||v.ended) end(); else v.requestVideoFrameCallback(cb)};
    v.playbackRate=1; v.requestVideoFrameCallback(cb); v.play().catch(end); setTimeout(end,2500);
  });
  const d=[]; for(let i=1;i<ts.length;i++){const x=ts[i]-ts[i-1]; if(x>0) d.push(x)}
  if(d.length<3) return 30;
  d.sort((a,b)=>a-b); const f=1/d[d.length>>1];
  return Math.max(15,Math.min(120,Math.round(f)));
}
async function encodeAudio(file){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC({sampleRate:48000});
    const buf=await ac.decodeAudioData(await file.arrayBuffer()); ac.close();
    if(!window.AudioEncoder) return null;
    const ch=Math.min(2,buf.numberOfChannels); let codec=null;
    for(const c of ["mp4a.40.2","opus"]){try{const r=await AudioEncoder.isConfigSupported({codec:c,sampleRate:48000,numberOfChannels:ch,bitrate:192000});if(r.supported){codec=c;break}}catch(e){}}
    if(!codec) return null;
    const chunks=[]; let err=null;
    const enc=new AudioEncoder({output:(c,m)=>chunks.push([c,m]),error:e=>err=e});
    enc.configure({codec,sampleRate:48000,numberOfChannels:ch,bitrate:192000});
    const chans=[...Array(ch).keys()].map(i=>buf.getChannelData(i));
    for(let o=0;o<buf.length;o+=4800){
      const n=Math.min(4800,buf.length-o), data=new Float32Array(n*ch);
      chans.forEach((d,i)=>data.set(d.subarray(o,o+n),i*n));
      const ad=new AudioData({format:"f32-planar",sampleRate:48000,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(o/48000*1e6),data});
      enc.encode(ad); ad.close();
    }
    await enc.flush(); enc.close();
    if(err) return null;
    return {chunks,codec,ch};
  }catch(e){return null}
}
async function runPass(rate,c,setP){
  const {v,cv,ctx,w,h,fps,br,codec,kind,aud,dur}=c;
  await seekTo(v,0);
  const target=new Mp4Muxer.ArrayBufferTarget();
  const muxer=new Mp4Muxer.Muxer({target,video:{codec:kind,width:w,height:h},
    ...(aud?{audio:{codec:aud.codec==="opus"?"opus":"aac",numberOfChannels:aud.ch,sampleRate:48000}}:{}),
    fastStart:"in-memory",firstTimestampBehavior:"offset"});
  let encErr=null;
  const venc=new VideoEncoder({output:(ch,m)=>muxer.addVideoChunk(ch,m),error:e=>encErr=e});
  venc.configure({codec,width:w,height:h,bitrate:br,framerate:fps,latencyMode:"quality"});
  const times=[]; let n=0;
  v.muted=true; v.playbackRate=rate;
  await v.play();
  await new Promise((resolve,reject)=>{
    let done=false; const fin=()=>{if(!done){done=true;resolve()}};
    const onFrame=async(now,meta)=>{
      try{
        const t=meta.mediaTime;
        if(!times.length||t>times[times.length-1]+1e-6){
          ctx.drawImage(v,0,0,w,h);
          const fr=new VideoFrame(cv,{timestamp:Math.round(t*1e6)});
          venc.encode(fr,{keyFrame:n%(fps*2)===0}); fr.close(); n++; times.push(t);
          if(n%3===0) setP(Math.min(99,t/dur*100));
        }
        if(encErr) throw encErr;
        if(venc.encodeQueueSize>6){ v.pause(); while(venc.encodeQueueSize>1) await sleep(4); if(!v.ended) await v.play(); }
        if(!v.ended) v.requestVideoFrameCallback(onFrame); else fin();
      }catch(e){done=true;reject(e)}
    };
    v.onended=()=>setTimeout(fin,250);
    v.requestVideoFrameCallback(onFrame);
  });
  v.pause();
  await venc.flush(); venc.close();
  const d=[]; for(let i=1;i<times.length;i++) d.push(times[i]-times[i-1]);
  const med=d.slice().sort((a,b)=>a-b)[d.length>>1]||1/fps;
  const drops=d.filter(x=>x>med*1.7).length;
  if(aud) aud.chunks.forEach(([ch,m])=>muxer.addAudioChunk(ch,m));
  muxer.finalize();
  return {buffer:target.buffer,drops,n};
}
async function process(){
  closeModal(); S.step=3; view();
  const m=METHODS[S.method];
  const v=$("#vid"), cv=$("#cv"), ctx=cv.getContext("2d");
  const setP=p=>{const b=$("#pb");if(b){b.style.width=p+"%";$("#pt").textContent=Math.round(p)+"%"}};
  const fail=msg=>{showErr(msg);const r=document.createElement("button");r.className="btn ghost";r.textContent="Kembali";r.onclick=()=>{S.step=2;view()};$("#app .panel").appendChild(r)};
  try{
    if(!window.Mp4Muxer) await loadScript("https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.min.js");
    if(!(window.VideoEncoder&&window.VideoFrame&&v.requestVideoFrameCallback)) return fail("Browser ini belum mendukung WebCodecs. Gunakan Chrome atau Edge terbaru.");
    if(!window.Mp4Muxer) return fail("Library muxer gagal dimuat. Periksa koneksi internet lalu coba lagi.");
    v.src=URL.createObjectURL(S.file); v.muted=true;
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error("Video tidak bisa dibaca browser."))});
    const dur=v.duration, vw=v.videoWidth, vh=v.videoHeight;
    let sc=m.h?Math.min(1,m.h/Math.min(vw,vh)):1;
    if(S.upscale&&Math.min(vw,vh)<1080) sc=1080/Math.min(vw,vh);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
    let w=Math.round(vw*sc), h=Math.round(vh*sc); w-=w%2; h-=h%2; cv.width=w; cv.height=h;
    $("#pt").textContent="Menganalisis video...";
    const fps=await probeFps(v);
    let br=m.br; if(S.extra==="Anti Lag") br=Math.min(br,7e6); if(S.extra==="TikTok") br=Math.min(br,5e6);
    let kind=S.codec, codec=await pickCodec(kind,w,h,br,fps), note="";
    if(!codec&&kind==="hevc"){kind="avc";codec=await pickCodec(kind,w,h,br,fps);note=" (HEVC tidak didukung, dipakai H.264)"}
    if(!codec) return fail("Browser tidak bisa meng-encode H.264 pada resolusi ini.");
    $("#pt").textContent="Menyiapkan audio...";
    const aud=await encodeAudio(S.file);
    const c={v,cv,ctx,w,h,fps,br,codec,kind,aud,dur};
    let res=null;
    for(const rate of [0.5,0.25,0.125]){
      setP(0); res=await runPass(rate,c,setP);
      if(res.drops<=Math.max(1,res.n*0.01)) break;
    }
    const base=S.file.name.replace(/\.[^.]+$/,"");
    S.out={blob:new Blob([res.buffer],{type:"video/mp4"}),ext:"mp4",name:`zenmethod_${base}_${S.method}.mp4`};
    S.engine2=`WebCodecs \u00b7 ${kind==="hevc"?"HEVC (H.265)":"H.264"} \u00b7 ${w}x${h} \u00b7 ${fps} FPS \u00b7 ${dur.toFixed(1)} dtk${aud?"":" \u00b7 tanpa audio"}${note}`;
    S.quota=Math.max(0,S.quota-(S.method==="max"?1:0));
    S.step=4; view();
  }catch(e){ S.step=3; view(); fail(e.message||"Terjadi kesalahan saat merender."); }
}

view();
</script>
